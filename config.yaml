name: "ChoreBot"
version: "0.3.0"
slug: "chorebot"
description: "Household chore tracker with overdue alerts"
image: ghcr.io/njyjn/chorebot
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 0
panel_icon: mdi:clipboard-check-outline
panel_title: Chore Audit
panel_admin: true
webui: "http://[HOST]:[PORT:3002]"
homeassistant_api: true
hassio_api: true
map:
  - type: share
    read_only: false
options:
  database_url: ""
  port: 3002
  helper_name: "Aye Aye"
  alert_time: "20:00"
  notify_service: ""
  notify_target: ""
  slack_webhook_url: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  reminders_title: "TAKING CARE OF ZARA - CANNOT FORGET"
  audit_users: []
  reminders:
    - "MUST ALWAYS WATCH ZARA"
    - "Cut all fruits like grapes, blueberry that can easily choke"
    - "Remove bones of fish separately before mixing with Zara food"
    - "Lock all cabinets"
    - "Put door hook/sponges on ALL doors"
schema:
  database_url: "str?"
  port: "port"
  helper_name: "str?"
  alert_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  notify_service: "str?"
  notify_target: "str?"
  slack_webhook_url: "str?"
  telegram_bot_token: "password?"
  telegram_chat_id: "str?"
  reminders_title: "str?"
  audit_users:
    - "str"
  reminders:
    - "str"
arch:
  - aarch64
